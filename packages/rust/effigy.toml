[manifest]
minimum_effigy_version = "0.15.0"

[catalog]
alias = "rust-quality"

[tasks]
"check:rust-quality" = [{ rhai = "scripts/check-rust-quality.rhai" }]
# Nonmutating shell format check for this package's maintained shell sources.
# Rhai sources have no maintained formatter, so the repository `format:check`
# declares that limitation. Requires shfmt (mvdan/sh v3) on PATH.
"format:check" = "shfmt --diff --indent 4 --language-dialect posix scripts/prove-installed-invocation.sh scripts/self-check.sh"
"rust-quality:setup" = [{ rhai = "scripts/rust-quality-setup.rhai" }]
"test:rust-quality-setup" = [{ task = "rust-quality:setup self-test" }]
"test:rust-quality-engine" = "cargo test --manifest-path tools/rust-quality/Cargo.toml"
"test:rust-quality-installed-route" = { run = "scripts/prove-installed-invocation.sh", durable = true }
"qa:docs:paths" = "effigy docs check paths SKILL.md northstar-package.json effigy.toml scripts/self-check.sh scripts/prove-installed-invocation.sh references/modes/rust-quality-authoring.md references/modes/rust-quality-audit.md"
"qa:docs:workflow" = "effigy docs check contains SKILL.md --require 'Do not activate from ordinary Rust coding' --require 'Thin explicit entrypoint'"
"qa:docs" = [
  { task = "qa:docs:paths" },
  { task = "qa:docs:workflow" },
]
health = [{ task = "check:rust-quality" }]
qa = [
  { task = "qa:docs" },
  { task = "check:rust-quality" },
  { task = "test:rust-quality-setup" },
  { task = "test:rust-quality-engine" },
  { task = "test:rust-quality-installed-route" },
]
